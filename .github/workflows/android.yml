name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          for i in 1 2 3; do ./gradlew assembleDebug && break; echo "Tentativa $i falhou, repetindo..."; sleep 15; done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tp-checklist.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tp-checklist-apk
          path: tp-checklist.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TP Checklist build ${{ github.run_number }}
          files: tp-checklist.apk
